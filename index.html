<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ShortLink</title>

  <meta
    name="description"
    content="Create short, shareable links"
  >

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="wrap">

    <section class="card">

      <div class="logo">↗</div>

      <h1>Shorten your link</h1>

      <p class="sub">
        Create a clean, shareable short URL.
      </p>

      <form id="form">

        <label for="url">
          Long URL
        </label>

        <input
          id="url"
          type="url"
          placeholder="https://example.com/your-long-url"
          required
        >

        <label for="custom">
          Custom code
          <span>(optional)</span>
        </label>

        <input
          id="custom"
          maxlength="32"
          placeholder="my-link"
        >

        <label for="expiresAt">
          Expiration
          <span>(optional)</span>
        </label>

        <input
          id="expiresAt"
          type="datetime-local"
        >

        <button type="submit">
          Create short link
        </button>

      </form>

      <div id="message"></div>

      <div id="result" class="result hidden">

        <div>
          <small>Your short link</small>

          <a
            id="shortUrl"
            target="_blank"
            rel="noopener"
          ></a>
        </div>

        <button
          id="copy"
          type="button"
          class="copy"
        >
          Copy
        </button>

      </div>

    </section>

    <footer>
      Powered by Cloudflare Pages + D1
    </footer>

  </main>

  <script src="/app.js"></script>

</body>
</html>
